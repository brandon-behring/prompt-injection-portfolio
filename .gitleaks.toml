# gitleaks config for prompt-injection-portfolio.
# Extends the default ruleset; adds a NARROW allowlist for a documented false positive:
# dataset CITATION KEYS (bibkeys) like `guychuk2024benignmalicious` trip the
# `generic-api-key` rule because the JSON field name `"bibkey"` contains "key" and the
# value is high-entropy. These are public citation identifiers, not credentials.
# The allowlist matches the citation-key shape (lowercase + 4-digit year + lowercase),
# so it does NOT hide random/mixed-case/hex API keys.
title = "prompt-injection-portfolio"

[extend]
useDefault = true

[allowlist]
description = "Dataset citation keys (bibkeys) + short git/content SHAs are not secrets"
regexes = [
  # citation bibkeys, e.g. guychuk2024benignmalicious, cui2024orbench, deepset2023promptinjections
  '''[a-z][a-z0-9]*20[0-9]{2}[a-z][a-z0-9]*''',
  # short git revision SHAs pinned in dataset_specs.yml (e.g. 4f61ecb038e9)
  '''\b[0-9a-f]{7,40}\b''',
]
