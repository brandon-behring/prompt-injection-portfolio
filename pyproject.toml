[project]
name = "prompt-injection-portfolio"
version = "0.1.0-pre"
description = "Methodology case study extending prompt-injection-detection-prototype: can we climb the OOD wall? Pre-alpha."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

# Load-bearing PyPI libraries — NEVER hand-rolled (per ADR-026 + Round-10
# library-first invariant). Missing primitive → upstream issue + MR; portfolio
# pins the new version when shipped. No local workarounds.
#
# Pin policy: minimum version pin (>=) for compatibility-range, matching the
# submission's most-recently-pinned versions (v1.0.9 / v1.1.0 + later).
# Portfolio bumps these as upstream patches land; per ADR-013 cost discipline,
# bumps that change behavior require a `decisions/library_imports.md` row.
dependencies = [
    # eval-toolkit v1.0+ stability contract (ADR-051; upstream ADR 0003): the
    # Tier-1 API + 9 Protocols are frozen for the 1.x line, so M1+ lane code is
    # written against a stable surface. [probes,losses] extras pull torch +
    # transformers for ActivationDeltaProbe + RecallAtLowFPR (already in ML stack).
    # Floor >=1.6 (R28, 2026-05-29): adds the Tier-2 `eda` Job-2 + Job-3 modules —
    # `lexical_association` (C1 log-odds/PMI + C2 competency baselines, #86) +
    # `distribution_shift` (E1 proxy-A-distance + MMD + kNN purity, #87) — built
    # upstream + DOGFOODED in Phase-3 pre-modeling EDA (experiments/eda/ — the
    # OOD-wall prediction's V5 + V9). Extends the >=1.5 floor (Job-1 eda #83 +
    # schema-aware HFDatasetsLoader #85). Lane code (M1+) still targets the frozen v1.x surface.
    # Floor >=1.8 (2026-06-04): adds `bootstrap.stratified_cluster_bootstrap_ci` (DF-10, #92) — the
    # composite multi-stratum cluster bootstrap that fits the seed-averaged LODO estimators (the
    # v1.7.0 single-block `cluster_bootstrap_ci` (DF-9, #90) could not). Consumed to re-lock +
    # reproduce the 3 LODO bootstraps (attack-type §6.5 / carrier / dialect).
    "eval-toolkit[probes,losses]>=1.8",
    # research_toolkit is consumed as TOOLING — the dossier-audit validators +
    # Claude skills — NOT a Python import, so it is deliberately NOT a dependency
    # here (ADR-051). `make dossier-audit` bootstraps a repo-local clone pinned to
    # a release tag (.tooling/research_toolkit). This keeps the portfolio env lean:
    # research_toolkit's docling/pdfplumber deps are irrelevant to validation.
    # Standard ML stack (matches submission v1.0.7+):
    "huggingface_hub>=0.25",
    "pyyaml>=6",
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "sentence-transformers>=3.0",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "transformers>=4.48",
    "peft>=0.13",
    "torch>=2.5",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    "pydantic>=2.5",
    "anthropic>=0.40",
    "openai>=1.50",
    "matplotlib>=3.8",
    # Lane 3 RAG demo deps (per plan §5):
    "gradio>=4.0",
    "faiss-cpu>=1.8",
    # Lane 4 stacker deps:
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    # Quality gates per plan §2 Tier-4:
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8",
    "pytest-cov>=4",
    "types-PyYAML>=6",
    "pandas-stubs>=2.2",
    # Local-only orchestrator — never imported by remote pods. Per Round 10
    # pin + submission v1.1.0 ADR-059:
    "runpod-deploy>=0.8.4",
    # Notebook authoring (jupytext-paired .py + .ipynb per Round 5 Q5'):
    "jupytext>=1.16",
    "jupyter>=1.0",
    "nbval>=0.11",
    "umap-learn>=0.5",
]

[tool.uv.sources]
# Submission is the prototype — editable dep at sibling path (Round 6 Q1''''').
# Local layout assumed: ../prompt-injection-detection-submission/
#
# CI uses two-step `actions/checkout@v4` to clone submission at a pinned tag.
# Currently `ref: v1.3.0` per Round 22 (was v1.2.16 at Round 21; v1.3.0 ships
# the two-guide reader architecture validating portfolio's R17 3-guide direction).
# Advances forward as submission ships polish patches; re-detect via
# `git ls-remote --tags origin | grep refs/tags/v1.X.X | sort -V | tail -1`.
#
# NOTE: eval-toolkit / runpod-deploy are PyPI artifacts — never use editable
# local paths for them. They are infrastructure for multiple projects, not
# portfolio-specific code (per ADR-026).
prompt-injection-detection-prototype = { path = "../prompt-injection-detection-submission", editable = true }

[tool.ruff]
line-length = 100
target-version = "py313"
# experiments/ holds exploratory EDA drivers + experiment-record scaffolds, not library
# code — excluded from strict lint (src/ scripts/ tests/ stay fully linted + mypy-strict).
extend-exclude = ["experiments/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
# E: pycodestyle errors; F: pyflakes; I: isort; B: bugbear; UP: pyupgrade;
# N: pep8-naming; W: pycodestyle warnings.

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

# The attack-type-LODO harness modules live in experiments/attack-type-lodo/ — a
# hyphenated dir (not an importable package) loaded by its tests via sys.path
# injection (mirroring experiments/eda/OOD_WALL_PREDICTION/run_prediction.py).
# experiments/ is outside the mypy target set (src/scripts/tests), so mypy cannot
# resolve these by name; silence the unavoidable import-not-found in tests/experiments/.
[[tool.mypy.overrides]]
module = ["folds", "metrics", "detectors", "falsify_ood_wall", "falsify_clustered", "falsify_carrier_lodo", "harness", "reference_scorers", "bipia_carrier", "survey_run", "build_corpus", "c1_verdict", "leakage_gate", "run_c1"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "smoke: lightweight end-to-end smoke tests",
    "integration: heavier tests requiring external resources (opt-in via -m integration)",
    "contract: test-contracts enforcing anti-pattern firewall (per plan §2 Tier-4)",
]
addopts = "-q --strict-markers"
