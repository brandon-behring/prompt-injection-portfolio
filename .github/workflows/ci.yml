# Portfolio CI — M0 Day 2 draft.
#
# Implements two-step checkout per plan §3 + F2 risk resolution:
# - Step 1: checkout portfolio repo (`actions/checkout@v4` to `./`)
# - Step 2: checkout submission at pinned tag (`ref: v1.3.0`) to sibling path
#   so `[tool.uv.sources]` editable dep resolves at uv sync time
#
# Per Round 14 Q1 + Round 21 dynamic-tag-detection, submission ref: advances
# automatically with each portfolio Day 3a re-sync. Update both `ref:` value
# + the corresponding pyproject.toml [tool.uv.sources] comment together.
# Current pin: v1.3.0 (was v1.1.1 at M0 Day 2; v1.2.16 at Round 21; v1.3.0 at Round 22 —
# submission's two-guide reader architecture aligns with portfolio's R17 3-guide direction).
#
# Quality gates per plan §2 Tier-4 + Round 7 ADR-036:
# - ruff check (lint) + ruff format --check (format)
# - mypy --strict (type-checking)
# - pytest unit + smoke (excludes integration; opt-in via -m integration)
# - test-contracts (per plan §2 Tier-4 + §18 7th `test_experiment_records_complete`)
#
# Test-contracts implementation lands at M0 Day 3 (currently scaffolded).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          path: prompt-injection-portfolio

      - name: Checkout prototype (pinned to v1.3.0 per Round 14 Q1 + Round 22 dynamic-detect)
        uses: actions/checkout@v4
        with:
          repository: brandon-behring/prompt-injection-detection-prototype
          ref: v1.3.0
          path: prompt-injection-detection-prototype

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies (incl. editable submission)
        working-directory: prompt-injection-portfolio
        run: uv sync --extra dev

      - name: Run pre-flight verifications (read-only sanity checks)
        working-directory: prompt-injection-portfolio
        run: |
          make verify-data-sources
          make verify-deps
          # verify-docker not run in CI (no nested Docker; Docker-in-Docker complications)

      - name: ruff check (lint)
        working-directory: prompt-injection-portfolio
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: prompt-injection-portfolio
        run: uv run ruff format --check .

      - name: mypy --strict
        working-directory: prompt-injection-portfolio
        run: uv run mypy --strict src/ scripts/ tests/

      - name: pytest unit + smoke
        working-directory: prompt-injection-portfolio
        run: uv run pytest -m "not integration"

      - name: test-contracts (anti-pattern firewall)
        working-directory: prompt-injection-portfolio
        run: uv run pytest -m contract
