    - 0
    sha256_of_span: unknown
    excerpt: "Injection-relevant reading: because contextual embeddings occupy an anisotropic narrow cone (high baseline cosine similarity between arbitrary tokens), naive cosine thresholds compress the separation between benign and poisoned chunks \u2014 bearing on retrieval dedup and on whether a provenance/trust signal is linearly separable in embedding space. Anisotropy is why retrieval-side detectors that rely on raw cosine geometry need calibration (whitening / isotropy correction) before they can distinguish an injected chunk from a legitimately-similar one."
