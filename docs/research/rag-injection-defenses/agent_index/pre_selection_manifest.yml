    - 0
    sha256_of_span: unknown
    excerpt: "Injection-relevant reading: because attention is U-shaped over context position, a retrieved chunk's rank in the assembled prompt changes how strongly it is attended \u2014 an injected/poisoned chunk surfaced at the head or tail of the context is more salient (more likely to drive output) than the same chunk buried in the middle. Retrieval-side defenses that re-rank or reposition retrieved spans therefore alter injection efficacy independent of the chunk's content."
