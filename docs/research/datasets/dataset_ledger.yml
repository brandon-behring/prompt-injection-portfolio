    in a game framing, NOT indirect/web/RAG. (c) Encoder-readiness: PARTIAL — the extraction-detection
    benchmark is closest to (text,label); column meanings need the bundled notebook. CAVEAT: NO license file
    in the repo (license unknown) — do not redistribute/train-and-publish without confirming terms.

