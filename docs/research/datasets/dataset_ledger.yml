- bibkey: leolee2024notinject
  primary_url: https://huggingface.co/datasets/leolee99/NotInject
  name: NotInject
  source: huggingface
  status: verified
  task_family: other
  license: mit
  size: '339 rows (3 subsets x 113)'
  rows: '339'
  columns: 'prompt, word_list, category'
  schema_url: https://huggingface.co/datasets/leolee99/NotInject
  access_method: hf datasets
  auth_required: false
  citation: 'Li, Liu (2024). InjecGuard/PIGuard: Mitigating Over-defense in Prompt Injection Guardrails. arXiv:2410.22770; ACL 2025.'
  notes: >-
    (a) NO positive class — ALL 339 samples are BENIGN by construction; `category` in {Common Queries,
    Technique Queries, Virtual Creation, Multilingual Queries}; `word_list` holds the injection-trigger words
    deliberately embedded (the category is topic, NOT an attack-type label). (b) 339 benign rows in 3
    difficulty subsets (1/2/3 trigger words, 113 each); multilingual. (c) NOT a training set — an
    OVER-DEFENSE / false-positive-rate eval: score a detector by how few of these benign prompts it flags.
    Pairs with the harness-spec benign-FPR metric. Model: leolee99/PIGuard.

- bibkey: lakera2024pintbenchmark
  primary_url: https://github.com/lakeraai/pint-benchmark
  name: 'Prompt Injection Test (PINT) Benchmark'
  source: github
  status: unverified
  task_family: other
  license: 'MIT (harness/code) + custom restrictions: the labeled PINT dataset is NOT publicly distributed (anti-contamination)'
  size: '4,314 inputs (3,016 English / 1,298 non-English)'
  rows: '4314'
  columns: 'text, label, category (YAML schema expected by the harness; real data withheld)'
  schema_url: https://github.com/lakeraai/pint-benchmark
  access_method: credentialed
  auth_required: true
  citation: 'Lakera AI (2024). Prompt Injection Test (PINT) Benchmark.'
  notes: >-
    CONTAMINATION-AVOIDANCE NON-PUBLIC (verbatim Lakera): "The PINT Benchmark dataset is not publicly
    available in order to prevent the dilution of the PINT Benchmark from overfitting due to training on the
    inputs" and "Lakera Guard is not - and will never be - directly trained on any of the inputs in the PINT
    Benchmark dataset." (a) Categories: public/internal prompt injection, jailbreak, hard_negatives, chat,
    documents (approx mix: injections ~5%, jailbreaks ~1%, hard negatives ~21%, chat ~36%, documents ~36%).
    (b) ~4,314 inputs, mostly benign by design. (c) NOT encoder-ready / NOT for training — held-out neutral
    eval only; repo ships the scoring harness + an EXAMPLE yaml, not the corpus. Request via Lakera.

