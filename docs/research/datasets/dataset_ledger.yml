  name: 'Tensor Trust'
  source: github
  status: verified
  task_family: other
  license: unknown
  size: '~172,000 entries'
  rows: '~126000 prompt-injection attacks + ~46000 defense prompts'
  columns: 'documented in "Using the Tensor Trust dataset.ipynb"; dirs raw-data/, benchmarks/, detecting-extractions/'
  schema_url: https://github.com/HumanCompatibleAI/tensor-trust-data
  access_method: direct
  auth_required: false
  citation: 'Toyer et al. (2023). Tensor Trust: Interpretable Prompt Injection Attacks from an Online Game. arXiv:2311.01011.'
  notes: >-
    (a) Two interpretable attack families — prompt EXTRACTION and prompt HIJACKING — plus defense prompts;
    ships derived benchmark splits (benchmarks/, detecting-extractions/). (b) ~172K largest human-generated
