- bibkey: hackaprompt2023emnlp
  primary_url: https://huggingface.co/datasets/hackaprompt/hackaprompt-dataset
  name: hackaprompt/hackaprompt-dataset
  source: huggingface
  status: verified
  task_family: other
  license: 'MIT (dataset card; companion paper arXiv:2311.16119 is CC BY 4.0 — different artifact)'
  size: '~150 MB (HF 100K-1M category)'
  rows: '~600000 (paper "over 600,000 adversarial prompts"; exact count not on card)'
  columns: 'level, user_input, prompt, completion, model, expected_completion, correct, score, dataset, timestamp'
  schema_url: https://huggingface.co/datasets/hackaprompt/hackaprompt-dataset
  access_method: hf datasets
  auth_required: false
  citation: 'Schulhoff et al. (2023). Ignore This Title and HackAPrompt. EMNLP 2023. arXiv:2311.16119.'
  notes: >-
    (a) Per-row `correct` boolean (attack succeeded) + `level` (10 difficulty/defense levels) + `model`;
    attack-type taxonomy is in the PAPER, not a column — rows are not pre-labeled by technique. (b) ~600K
    prompts across GPT-3/ChatGPT/FlanT5-XXL (playground vs submission); effectively all-adversarial, no
    benign balance. DIRECT-injection / jailbreak (single-turn user-vs-system), NOT indirect/RAG. (c)
    Encoder-readiness: needs adaptation — (user_input, correct) is a weak attack-success signal with no clean
    injection-type label; best as a large adversarial-prompt source, not a drop-in (text,label) set.

- bibkey: tensortrust2023arxiv
