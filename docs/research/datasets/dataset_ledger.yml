# Maintained by /dataset-gather; validated by validators/dataset_ledger.py (v1.6, non-strict).
# Built 2026-05-27 (Phase C of the research-ops sprint). Feeds decisions/ADR-052
# (attack-type generalization) + docs/planning/attack-type-lodo-harness-spec.md.
#
# Encoder-readiness is captured per-entry in `notes` (c): whether the set is a
# drop-in (text,label) corpus for ModernBERT-style training, or needs adaptation
# (e.g. agent attack-success benchmarks that ship no labeled text).
#
# status: verified = WebFetch-confirmed name+url(+license); unverified = could not
# confirm the *data* (e.g. PINT withheld; IPI-in-the-wild corpus unreleased);
# mismatched = page attribution conflicts with recorded metadata.

topic: unsafe_input_guardrail_detection
