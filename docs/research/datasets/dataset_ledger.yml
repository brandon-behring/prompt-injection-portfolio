# Dataset ledger — indirect prompt-injection attack & detection datasets
# Maintained by /dataset-gather; validated by validators/dataset_ledger.py (v1.6, non-strict).
# Built 2026-05-27 (Phase C of the research-ops sprint). Feeds decisions/ADR-052
# (attack-type generalization) + docs/planning/attack-type-lodo-harness-spec.md.
#
# Encoder-readiness is captured per-entry in `notes` (c): whether the set is a
# drop-in (text,label) corpus for ModernBERT-style training, or needs adaptation
# (e.g. agent attack-success benchmarks that ship no labeled text).
#
# status: verified = WebFetch-confirmed name+url(+license); unverified = could not
# confirm the *data* (e.g. PINT withheld; IPI-in-the-wild corpus unreleased);
# mismatched = page attribution conflicts with recorded metadata.

topic: indirect_prompt_injection_datasets
generated_at: '2026-05-27'
current_as_of: '2026-05-27'

entries:

# ============================================================================
# Agent / benchmark harnesses (attack-success metrics; mostly need adaptation)
# ============================================================================

- bibkey: bipia2023microsoft
  primary_url: https://github.com/microsoft/BIPIA
  name: 'Benchmarking and Defending Against Indirect Prompt Injection Attacks on Large Language Models (BIPIA)'
  source: github
  status: verified
  task_family: classification
  license: 'MIT (code, Microsoft Corporation) + custom restrictions: benchmark/README notes some context data (WebQA, Summarization) cannot be redistributed "due to the license issue" and must be regenerated locally'
  size: 'text: 15+15 attack types x ~5 strings; code: 10+10 types x ~5; paired with Email/WebQA/TableQA/Summarization/CodeQA contexts'
  rows: '~150 text + ~100 code attack strings (x context tasks => eval instances)'
  columns: 'attack JSON {attack_type_name: [attack_string, ...]} + per-domain context data'
  schema_url: https://github.com/microsoft/BIPIA/blob/main/benchmark/README.md
  access_method: direct
  auth_required: false
  citation: 'Yi, Xie, Zhu, Hines, Kiciman, Sun, Xie, Wu (2023/2024). BIPIA. arXiv:2312.14197; KDD 2025.'
  notes: >-
    THE DIRECT INPUT TO ADR-052. (a) Explicit per-attack-type labels with a DISJOINT train/test
    split. Text: 15 train types vs 15 test types, ONLY "Language Translation" overlaps (intentional,
    for unseen-attack-type generalization), ~5 strings/type. Train text types = Information Retrieval,
    Content Creation, Learning and Tutoring, Language Translation, Programming Help, Alphanumeric
    Substitution, Homophonic Substitution, Misspelling Intentionally, Anagramming, Space Removal &
    Grouping, Instruction, Social Interaction, Persuasion, Clickbait, Malware Distribution. Test text
    types = Task Automation, Business Intelligence, Conversational Agent, Research Assistance, Sentiment
    Analysis, Substitution Ciphers, Base Encoding, Reverse Text, Emoji Substitution, Language
    Translation, Information Dissemination, Marketing & Advertising, Entertainment, Scams & Fraud,
    Misinformation & Propaganda. Code: 10 train vs 10 disjoint test types. The obfuscation sub-family
    (Alphanumeric/Homophonic Substitution, Anagramming, Substitution Ciphers, Base Encoding, etc.) is a
    clean technique slice. (b) Constructed by injecting attack strings into otherwise-benign task
    contexts (no fixed pre-split balance). (c) Encoder-readiness: NEAREST to plug-and-play here — clean
    per-type malicious strings + benign carriers => a derivable (text,binary-label) corpus; the disjoint
    type split is exactly the attack-type-LODO axis. CAVEAT: small diversity (~75 strings/split =>
    memorization risk). No official microsoft-org HF mirror yet (README TODO; only 3rd-party mirrors).

- bibkey: injecagent2024uiuc
  primary_url: https://github.com/uiuc-kang-lab/InjecAgent
  name: 'InjecAgent: Benchmarking Indirect Prompt Injections in Tool-Integrated Large Language Model Agents'
  source: github
  status: verified
  task_family: other
  license: MIT
  size: '1,054 test cases (17 user tools, 62 attacker tools)'
  rows: '1054'
  columns: 'user_cases.jsonl + attacker_cases_dh/ds.jsonl + test_cases_dh/ds_{setting}.json'
  schema_url: https://github.com/uiuc-kang-lab/InjecAgent
  access_method: direct
  auth_required: false
  citation: 'Zhan, Liang, Ying, Kang (2024). InjecAgent. arXiv:2403.02691; ACL 2024 Findings.'
  notes: >-
    (a) Two attack-intent categories: direct harm (dh) + data exfiltration/stealing (ds); not
    fine-grained per-string type labels. (b) All-attack test cases (no benign control split); measures
    whether injection succeeds (ASR-valid / ASR-all over ReAct tool-calling traces). (c) Encoder-readiness:
    NOT a drop-in (text,label) set — agent ASR benchmark; injected attacker-tool prompts can be mined as
    malicious text but no paired benign set, so a classifier corpus needs benign carriers supplied.

- bibkey: agentdojo2024ethz
  primary_url: https://github.com/ethz-spylab/agentdojo
  name: 'AgentDojo: A Dynamic Environment to Evaluate Prompt Injection Attacks and Defenses for LLM Agents'
  source: github
  status: verified
  task_family: other
  license: MIT
  size: '97 tasks + 629 security test cases'
  rows: '629 security test cases across 4 suites (workspace/email, banking, travel, slack)'
  columns: 'task suites: user_tasks + injection_tasks; environment state + tool defs (Python objects)'
  schema_url: https://github.com/ethz-spylab/agentdojo
  access_method: direct
  auth_required: false
  citation: 'Debenedetti, Zhang, Balunović, Beurer-Kellner, Fischer, Tramèr (2024). AgentDojo. arXiv:2406.13352; NeurIPS 2024 D&B.'
  notes: >-
    (a) Organized by injection-task + attack strategy (e.g. "important_instructions"), not (text,label)
    per-string categories. (b) 97 benign user tasks vs 629 security test cases; benign-utility AND
    under-attack performance both measured. (c) Encoder-readiness: NOT a drop-in static corpus — dynamic
    agent environment; heavy adaptation needed to render payloads vs benign tool outputs into text. Strong
    for agent-level eval, weak as encoder training data.

- bibkey: llmailinject2025microsoft
  primary_url: https://huggingface.co/datasets/microsoft/llmail-inject-challenge
  name: 'LLMail-Inject: A Dataset from a Realistic Adaptive Prompt Injection Challenge'
  source: huggingface
  status: verified
  task_family: other
  license: MIT
  size: '~462k rows (Phase1 ~371k + Phase2 ~90.9k); 208,095 unique attack prompts'
  rows: '~462000'
  columns: 'RowKey, Timestamp, subject, body, objectives (13), scenario (40), success flags (email.retrieved/defense.undetected/exfil.sent/...)'
  schema_url: https://huggingface.co/datasets/microsoft/llmail-inject-challenge
  access_method: hf datasets
  auth_required: false
  citation: 'Abdelnabi, Fay, Salem, Zverev, et al. (2025). LLMail-Inject. arXiv:2506.09956; SaTML 2025 competition.'
  notes: >-
    (a) Labeled by objectives (13 classes) + scenario (40 classes); per-submission success as binary
    flags (defense.undetected gives a usable detector target). (b) Heavily attack-skewed — 208k+ adaptive
    ATTACK submissions (839 participants); the signal is which attacks BYPASS which defense, not
    benign/malicious balance. (c) Encoder-readiness: PARTIAL — subject+body are real adversarial text and
    defense.undetected is a binary-ish target, but ALL rows are attacks (no benign emails) => add benign
    carriers for a balanced classifier. Largest real-world ADAPTIVE-attack corpus here; excellent hard-
    positive pool for detector robustness.

- bibkey: asb2024agiresearch
  primary_url: https://github.com/agiresearch/ASB
  name: 'Agent Security Bench (ASB): Formalizing and Benchmarking Attacks and Defenses in LLM-based Agents'
  source: github
  status: verified
  task_family: other
  license: MIT
  size: '10 scenarios, 10 agents, 400+ tools, 27 attack/defense methods, 13 LLM backbones'
  rows: 'combinatorial (scenarios x agents x attacks); not a flat row count'
  columns: 'scenario configs + agent/tool defs + attack/defense modules (code+config)'
  schema_url: https://github.com/agiresearch/ASB
  access_method: direct
  auth_required: false
  citation: 'Zhang, Huang, Mei, Yao, Wang, Zhan, Wang, Zhang (2024). Agent Security Bench. arXiv:2410.02644; ICLR 2025.'
  notes: >-
    (a) 5 attack families — Direct Prompt Injection (DPI), Observation Prompt Injection (OPI), Memory
    Poisoning, Plan-of-Thought (PoT) Backdoor, Mixed — over 27 methods; labels at method/scenario level,
    not per-string. (b) Attack-success-rate benchmark (peak ASR ~84%); not benign/malicious balanced.
    (c) Encoder-readiness: NOT a drop-in (text,label) set — ASR framework over a full agent stack; needs
    substantial adaptation to extract a labeled text corpus.

